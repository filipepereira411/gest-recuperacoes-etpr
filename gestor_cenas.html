<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Cenas & Recuperações</title>
    <style>
        :root {
            --bg-primary: #121214;
            --bg-secondary: #1a1a1e;
            --bg-tertiary: #26262b;
            --text-main: #e1e1e6;
            --text-muted: #8d8d99;
            --accent: #00b37e;
            --accent-hover: #00875f;
            --danger: #f75a68;
            --danger-hover: #c73e4a;
            --warning: #e1a412;
            --border: #29292e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar - Lista de Cenas */
        aside {
            width: 320px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            width: 100%;
            padding: 10px 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .scene-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px;
        }

        .scene-item {
            padding: 12px;
            background-color: var(--bg-tertiary);
            border: 1px solid transparent;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scene-item:hover {
            border-color: var(--accent);
        }

        .scene-item.active {
            border-color: var(--accent);
            background-color: #00b37e15;
        }

        .scene-info {
            flex: 1;
            overflow: hidden;
        }

        .scene-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .scene-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-primary);
        }

        .top-bar {
            height: 70px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .workspace {
            flex: 1;
            padding: 30px;
            display: flex;
            gap: 25px;
            overflow: hidden;
        }

        .editor-container {
            flex: 2;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            padding: 10px 12px;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: 1px solid var(--accent);
            border-color: var(--accent);
        }

        textarea.form-control {
            height: 250px;
            resize: none;
            font-family: inherit;
        }

        /* Painel de Recuperações */
        .recovery-container {
            flex: 1;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            min-width: 300px;
        }

        .recovery-header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .history-time {
            color: var(--warning);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .history-actions {
            margin-top: 8px;
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            margin-top: 40px;
            font-style: italic;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <div class="sidebar-header">
            <h2>🎬 Gestor de Cenas</h2>
            <button class="btn" onclick="createNewScene()">➕ Nova Cena</button>
        </div>
        <div class="scene-list" id="sceneList">
            <!-- Injetado dinamicamente -->
        </div>
    </aside>

    <!-- Main Content -->
    <main>
        <div class="top-bar">
            <h2 id="currentSceneTitle">Nenhuma cena selecionada</h2>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-secondary btn-sm" style="width: auto;" onclick="exportData()">📤 Exportar Backup</button>
                <button class="btn btn-secondary btn-sm" style="width: auto;" onclick="importDataClick()">📥 Importar Backup</button>
                <input type="file" id="importFile" style="display: none;" onchange="importData(event)">
            </div>
        </div>

        <div class="workspace">
            <!-- Editor -->
            <div class="editor-container" id="editorContainer" style="display: none;">
                <div class="form-group">
                    <label for="sceneName">Nome da Cena</label>
                    <input type="text" id="sceneName" class="form-control" oninput="updateCurrentScene()">
                </div>
                <div class="form-group">
                    <label for="sceneDescription">Descrição / Notas</label>
                    <textarea id="sceneDescription" class="form-control" oninput="updateCurrentScene()" placeholder="Escreve aqui os detalhes da cena..."></textarea>
                </div>
                <div class="action-row">
                    <button class="btn btn-danger" onclick="deleteCurrentScene()">🗑️ Eliminar Cena</button>
                </div>
            </div>

            <div class="editor-container" id="noSceneSelected" style="justify-content: center; align-items: center; text-align: center;">
                <p style="color: var(--text-muted); font-size: 1.1rem;">Selecione ou crie uma cena na barra lateral para começar a editar.</p>
            </div>

            <!-- Painel de Recuperação (Histórico de Alterações) -->
            <div class="recovery-container">
                <div class="recovery-header">
                    <h3>🕒 Recuperações (Histórico)</h3>
                </div>
                <div class="history-list" id="historyList">
                    <!-- Injetado dinamicamente -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // Estado da Aplicação
        let state = {
            scenes: {},
            history: [],
            activeSceneId: null
        };

        // Carregar do LocalStorage inicial
        function init() {
            const savedData = localStorage.getItem('gestor_cenas_data');
            if (savedData) {
                try {
                    state = JSON.parse(savedData);
                } catch (e) {
                    console.error("Erro ao carregar dados do localStorage", e);
                }
            }
            renderSceneList();
            renderHistory();
            updateWorkspace();
        }

        // Salvar estado atual e gerar ponto de recuperação se houver mudanças estruturais
        function saveState(createCheckpoint = false, checkpointLabel = "Alteração") {
            localStorage.setItem('gestor_cenas_data', JSON.stringify(state));
            
            if (createCheckpoint) {
                const snapshot = {
                    timestamp: new Date().toLocaleTimeString(),
                    date: new Date().toLocaleDateString(),
                    label: checkpointLabel,
                    data: JSON.parse(JSON.stringify(state.scenes)) // Deep copy das cenas
                };
                
                state.history.unshift(snapshot);
                if (state.history.length > 10) state.history.pop(); // Limite de 10 pontos
                localStorage.setItem('gestor_cenas_data', JSON.stringify(state));
                renderHistory();
            }
        }

        // Criar Nova Cena
        function createNewScene() {
            const id = 'scene_' + Date.now();
            state.scenes[id] = {
                id: id,
                title: 'Nova Cena Sem Nome',
                description: '',
                updatedAt: new Date().toLocaleTimeString()
            };
            state.activeSceneId = id;
            saveState(true, "Criação de Cena");
            renderSceneList();
            updateWorkspace();
        }

        // Atualizar campos da cena ativa em tempo real
        function updateCurrentScene() {
            if (!state.activeSceneId) return;
            
            const titleInput = document.getElementById('sceneName').value;
            const descInput = document.getElementById('sceneDescription').value;
            
            state.scenes[state.activeSceneId].title = titleInput || 'Cena Sem Nome';
            state.scenes[state.activeSceneId].description = descInput;
            state.scenes[state.activeSceneId].updatedAt = new Date().toLocaleTimeString();
            
            // Auto-salva no localStorage (sem criar novo snapshot no histórico para não poluir)
            localStorage.setItem('gestor_cenas_data', JSON.stringify(state));
            
            // Atualiza apenas o texto na barra lateral sem re-renderizar tudo
            const activeEl = document.querySelector(`.scene-item[data-id="${state.activeSceneId}"] .scene-title`);
            if (activeEl) activeEl.textContent = state.scenes[state.activeSceneId].title;
            
            document.getElementById('currentSceneTitle').textContent = state.scenes[state.activeSceneId].title;
        }

        // Debounce/Blur para gerar ponto de recuperação após terminar de digitar
        document.getElementById('sceneName').addEventListener('blur', () => saveState(true, "Edição de Título"));
        document.getElementById('sceneDescription').addEventListener('blur', () => saveState(true, "Edição de Conteúdo"));

        // Selecionar Cena
        function selectScene(id) {
            state.activeSceneId = id;
            saveState();
            renderSceneList();
            updateWorkspace();
        }

        // Eliminar Cena
        function deleteCurrentScene() {
            if (!state.activeSceneId) return;
            if (confirm("Tem a certeza que deseja eliminar esta cena?")) {
                delete state.scenes[state.activeSceneId];
                state.activeSceneId = null;
                saveState(true, "Eliminação de Cena");
                renderSceneList();
                updateWorkspace();
            }
        }

        // Renderizar Lista Lateral
        function renderSceneList() {
            const container = document.getElementById('sceneList');
            container.innerHTML = '';
            
            const sceneKeys = Object.keys(state.scenes);
            if (sceneKeys.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhuma cena criada.</div>';
                return;
            }
            
            sceneKeys.forEach(key => {
                const scene = state.scenes[key];
                const isActive = key === state.activeSceneId;
                
                const item = document.createElement('div');
                item.className = `scene-item ${isActive ? 'active' : ''}`;
                item.setAttribute('data-id', key);
                item.onclick = () => selectScene(key);
                
                item.innerHTML = `
                    <div class="scene-info">
                        <div class="scene-title">${scene.title}</div>
                        <div class="scene-meta">Atualizado às ${scene.updatedAt}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Atualizar painel de inputs
        function updateWorkspace() {
            const editor = document.getElementById('editorContainer');
            const noSelect = document.getElementById('noSceneSelected');
            
            if (state.activeSceneId && state.scenes[state.activeSceneId]) {
                editor.style.display = 'flex';
                noSelect.style.display = 'none';
                
                const scene = state.scenes[state.activeSceneId];
                document.getElementById('sceneName').value = scene.title === 'Nova Cena Sem Nome' ? '' : scene.title;
                document.getElementById('sceneDescription').value = scene.description;
                document.getElementById('currentSceneTitle').textContent = scene.title;
            } else {
                editor.style.display = 'none';
                noSelect.style.display = 'flex';
                document.getElementById('currentSceneTitle').textContent = 'Nenhuma cena selecionada';
            }
        }

        // Renderizar Lista de Recuperações
        function renderHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = '';
            
            if (!state.history || state.history.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhum ponto de recuperação disponível.</div>';
                return;
            }
            
            state.history.forEach((snapshot, index) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                
                item.innerHTML = `
                    <div class="history-time">⏱️ ${snapshot.date} - ${snapshot.timestamp}</div>
                    <div style="font-weight: 500;">${snapshot.label}</div>
                    <div style="color: var(--text-muted); font-size: 0.8rem; margin-top: 2px;">
                        ${Object.keys(snapshot.data).length} cena(s) guardada(s)
                    </div>
                    <div class="history-actions">
                        <button class="btn btn-secondary btn-sm" onclick="restoreCheckpoint(${index})">Restaurar</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Restaurar estado a partir do Histórico
        function restoreCheckpoint(index) {
            if (confirm("Deseja restaurar as cenas para esta versão anterior? O estado atual será substituído.")) {
                // Substitui apenas o dicionário de cenas
                state.scenes = JSON.parse(JSON.stringify(state.history[index].data));
                // Reseta a seleção se a cena ativa já não existir
                if (!state.scenes[state.activeSceneId]) {
                    state.activeSceneId = Object.keys(state.scenes)[0] || null;
                }
                saveState(true, "Restauro de Versão");
                renderSceneList();
                updateWorkspace();
            }
        }

        // Exportar Backup JSON
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_cenas_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDataClick() {
            document.getElementById('importFile').click();
        }

        // Importar Backup JSON
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState.scenes && importedState.history) {
                        state = importedState;
                        saveState(true, "Importação de Backup");
                        renderSceneList();
                        renderHistory();
                        updateWorkspace();
                        alert("Backup importado com sucesso!");
                    } else {
                        alert("Ficheiro inválido.");
                    }
                } catch (err) {
                    alert("Erro ao ler o ficheiro.");
                }
            };
            reader.readAsText(file);
        }

        // Inicializar aplicação
        window.onload = init;
    </script>
</body>
</html>
